[project]
name = "filtflow"
version = "0.1.0"
description = "Real-time audio filter for Windows microphone input via WASAPI"
readme = "README.md"
requires-python = ">=3.13.5"
dependencies = [
    "pyside6>=6.7.0",
    "pyqtdarktheme>=2.1.0",
    "numpy>=2.4.4",
    "pillow>=12.1.1",
    "pystray>=0.19.5",
    "sounddevice>=0.5.5",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pyinstaller>=6.19.0",
    "pytest>=8.0.0",
    "ruff>=0.15.8",
]
